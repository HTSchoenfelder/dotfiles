# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# setup/macos/setup-appearance.sh creates the matching opt-in symlink on macOS.
globinclude ${KITTY_OS}-appearance-enabled.conf

# Keep right Option available for AltGr characters on macOS.
macos_option_as_alt left

font_family      Agave Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 16.0
